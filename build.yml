name: Build Sans Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Organize files into the correct folders
        run: |
          MISSING=0
          place() {
            name="$1"; dest="$2"
            if [ -f "$dest/$name" ]; then
              echo "OK: $dest/$name"
              return
            fi
            found=$(find . -type f -name "$name" -not -path "./.git/*" -not -path "./build/*" -not -path "./.gradle/*" | head -n 1)
            if [ -z "$found" ]; then
              echo "MISSING: $name"
              MISSING=1
              return
            fi
            mkdir -p "$dest"
            cp "$found" "$dest/$name"
            echo "Placed $found -> $dest/$name"
          }
          place build.gradle .
          place settings.gradle .
          place gradle.properties .
          place fabric.mod.json src/main/resources
          place en_us.json src/main/resources/assets/sansmod/lang
          place SansMod.java src/main/java/com/sansmod
          place Keybinds.java src/main/java/com/sansmod
          place ConfigManager.java src/main/java/com/sansmod/config
          place ModConfig.java src/main/java/com/sansmod/config
          place MainScreen.java src/main/java/com/sansmod/gui
          if [ "$MISSING" = 1 ]; then
            echo "::error::Some files are missing from the repository. See the MISSING lines above."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build mod
        run: gradle build --stacktrace

      - name: Verify JAR is not empty
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n 1)
          unzip -l "$JAR" | tee jar-list.txt
          grep -q "fabric.mod.json" jar-list.txt
          grep -q "com/sansmod/SansMod.class" jar-list.txt

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SansMod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
